name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages and release binaries
    runs-on: ubuntu-latest
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Confirm tag and package version agree
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Write production build configuration
        shell: bash
        run: |
          cat > .env <<EOF
          TQX_BUILD_BASE_URL=$TQX_BUILD_BASE_URL
          TQX_BUILD_TRADING_BASE_URL=$TQX_BUILD_TRADING_BASE_URL
          TQX_BUILD_GET_API_KEY_URL=$TQX_BUILD_GET_API_KEY_URL
          EOF
          cp .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release checks
        run: bun run release:check

      - name: Build SDK and CLI
        run: bun run build

      - name: Pack npm tarballs with Bun
        shell: bash
        run: |
          mkdir -p release-artifacts
          bun pm pack --cwd packages/sdk --destination "$GITHUB_WORKSPACE/release-artifacts" --quiet
          bun pm pack --cwd packages/cli --destination "$GITHUB_WORKSPACE/release-artifacts" --quiet

      - name: Publish SDK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm publish "$GITHUB_WORKSPACE/release-artifacts/tqx-ai-sdk-${version}.tgz" \
            --access public --tag latest

      - name: Publish CLI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm publish "$GITHUB_WORKSPACE/release-artifacts/tqx-ai-cli-${version}.tgz" \
            --access public --tag latest

      - name: Compile standalone binaries
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-bin
          bun build --compile --target=bun-linux-x64 --outfile="dist-bin/tqx-v${version}-linux-x64" packages/cli/dist/index.mjs
          bun build --compile --target=bun-linux-arm64 --outfile="dist-bin/tqx-v${version}-linux-arm64" packages/cli/dist/index.mjs
          bun build --compile --target=bun-darwin-x64 --outfile="dist-bin/tqx-v${version}-macos-x64" packages/cli/dist/index.mjs
          bun build --compile --target=bun-darwin-arm64 --outfile="dist-bin/tqx-v${version}-macos-arm64" packages/cli/dist/index.mjs
          bun build --compile --target=bun-windows-x64 --outfile="dist-bin/tqx-v${version}-windows-x64.exe" packages/cli/dist/index.mjs

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist-bin
          sha256sum tqx-* > SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="$GITHUB_REF_NAME"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md"

          cat > release-notes.md <<'EOF'
          ## TQX ${tag}

          TQX CLI binaries and npm packages for version **${version}**.

          ### Which binary should I download?

          Standalone binaries include the TQX CLI runtime and its dependencies. Download one file for your platform; you do **not** need Node.js, Bun, or `npm install`.

          - **Windows 64-bit (Intel or AMD)**: [tqx-v${version}-windows-x64.exe](${download_url}/tqx-v${version}-windows-x64.exe)
          - **macOS on Apple Silicon (M1/M2/M3/M4)**: [tqx-v${version}-macos-arm64](${download_url}/tqx-v${version}-macos-arm64)
          - **macOS on Intel**: [tqx-v${version}-macos-x64](${download_url}/tqx-v${version}-macos-x64)
          - **Linux 64-bit (Intel or AMD)**: [tqx-v${version}-linux-x64](${download_url}/tqx-v${version}-linux-x64)
          - **Linux ARM64**: [tqx-v${version}-linux-arm64](${download_url}/tqx-v${version}-linux-arm64)

          **Architecture guide:** `x64`, `x86_64`, and `AMD64` mean the same 64-bit Intel/AMD architecture. `arm64` means 64-bit ARM. On Windows, choose the x64 executable unless Windows reports an ARM64 system. On macOS, choose arm64 for Apple Silicon and x64 for Intel Macs.

          ### Install the standalone CLI globally

          **Windows PowerShell** (run from the directory containing the downloaded `.exe`):

          Double-clicking the `.exe` is not a GUI action. With no arguments it only prints the CLI help and exits; use PowerShell or Command Prompt to run commands.

          ```powershell
          $binDir = Join-Path $HOME '.local\bin'
          New-Item -ItemType Directory -Force $binDir | Out-Null
          Move-Item .\tqx-v${version}-windows-x64.exe (Join-Path $binDir 'tqx.exe') -Force
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$binDir*") {
            [Environment]::SetEnvironmentVariable('Path', "$userPath;$binDir", 'User')
          }
          $env:Path = "$binDir;$env:Path"
          tqx --version
          ```

          Open a new terminal after installation so Windows loads the updated user `PATH`.

          **macOS and Linux** (replace `<downloaded-file>` with the binary selected above):

          ```sh
          mkdir -p ~/.local/bin
          mv ./<downloaded-file> ~/.local/bin/tqx
          chmod +x ~/.local/bin/tqx
          export PATH="$HOME/.local/bin:$PATH"
          tqx --version
          tqx --help
          ```

          Add `export PATH="$HOME/.local/bin:$PATH"` to your shell startup file (such as `~/.zshrc` or `~/.bashrc`) if it is not already on `PATH`. To upgrade, replace `~/.local/bin/tqx` or `tqx.exe` with the binary from the newer release.

          ### Checksums

          Download [SHA256SUMS](${download_url}/SHA256SUMS) to verify binary integrity.

          ### npm packages for application developers

          Use npm packages only when integrating TQX into a Node.js application. They are not required for standalone binary users.

          ```sh
          npm install --global @tqx-ai/cli@${version}
          npm install @tqx-ai/sdk@${version}
          ```

          ### Changelog

          See the [full CHANGELOG.md](${changelog_url}) for this release and previous releases.

          EOF

          sed -i \
            -e "s|\\${tag}|$tag|g" \
            -e "s|\\${version}|$version|g" \
            -e "s|\\${download_url}|$download_url|g" \
            -e "s|\\${changelog_url}|$changelog_url|g" \
            release-notes.md

          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
            found && $0 ~ "^## " { exit }
            found { print }
          ' CHANGELOG.md >> release-notes.md

          cat >> release-notes.md <<'EOF'

          ### Downloadable assets

          EOF
          for file in release-artifacts/*.tgz dist-bin/*; do
            name="$(basename "$file")"
            printf -- '- [%s](%s/%s)\n' "$name" "$download_url" "$name" >> release-notes.md
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz dist-bin/* \
            --title "TQX $GITHUB_REF_NAME" \
            --notes-file release-notes.md
