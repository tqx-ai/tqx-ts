name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs are dry runs: they build, compress, and verify every binary on its own platform and
  # keep the results as workflow artifacts, but never publish to npm or create a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages and release binaries
    runs-on: ubuntu-latest
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Confirm tag and package version agree
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Write production build configuration
        shell: bash
        run: |
          cat > .env <<EOF
          TQX_BUILD_BASE_URL=$TQX_BUILD_BASE_URL
          TQX_BUILD_TRADING_BASE_URL=$TQX_BUILD_TRADING_BASE_URL
          TQX_BUILD_GET_API_KEY_URL=$TQX_BUILD_GET_API_KEY_URL
          EOF
          cp .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release checks
        run: bun run release:check

      - name: Build SDK and CLI
        run: bun run build

      - name: Pack npm tarballs with Bun
        shell: bash
        run: |
          mkdir -p release-artifacts
          bun pm pack --cwd packages/sdk --destination "$GITHUB_WORKSPACE/release-artifacts" --quiet
          bun pm pack --cwd packages/cli --destination "$GITHUB_WORKSPACE/release-artifacts" --quiet

      - name: Publish SDK
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="latest"
          [[ "$version" == *-* ]] && tag="beta"
          npm publish "$GITHUB_WORKSPACE/release-artifacts/tqx-ai-sdk-${version}.tgz" \
            --access public --tag "$tag" --provenance

      - name: Publish CLI
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="latest"
          [[ "$version" == *-* ]] && tag="beta"
          npm publish "$GITHUB_WORKSPACE/release-artifacts/tqx-ai-cli-${version}.tgz" \
            --access public --tag "$tag" --provenance

      - name: Compile Linux standalone binaries
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-bin
          bun build --compile --target=bun-linux-x64 --outfile="dist-bin/tqx-v${version}-linux-x64" packages/cli/dist/index.mjs
          bun build --compile --target=bun-linux-arm64 --outfile="dist-bin/tqx-v${version}-linux-arm64" packages/cli/dist/index.mjs

      - name: Upload package and Linux release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-unix
          path: |
            release-artifacts/*.tgz
            dist-bin/*
          if-no-files-found: error

  compile-macos:
    name: Compile and sign macOS standalone binaries
    runs-on: macos-latest
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Write production build configuration
        shell: bash
        run: |
          printf 'TQX_BUILD_BASE_URL=%s\nTQX_BUILD_TRADING_BASE_URL=%s\nTQX_BUILD_GET_API_KEY_URL=%s\n' \
            "$TQX_BUILD_BASE_URL" "$TQX_BUILD_TRADING_BASE_URL" "$TQX_BUILD_GET_API_KEY_URL" > .env
          cp .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and CLI
        run: bun run build

      - name: Compile and ad-hoc sign macOS standalone binaries
        shell: bash
        run: |
          version="$(bun -p "require('./package.json').version")"
          mkdir -p dist-bin
          for arch in x64 arm64; do
            binary="dist-bin/tqx-v${version}-macos-${arch}"
            bun build --compile --target="bun-darwin-${arch}" --outfile="$binary" packages/cli/dist/index.mjs
            # Appending the CLI invalidates the Bun runtime's embedded signature. The darwin-x64
            # runtime keeps Bun's Developer ID signature, and macOS then rejects keychain reads
            # (errSecAuthFailed), so Bun.secrets can store an API key but never read it back.
            codesign --force --sign - "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-macos
          path: dist-bin/*
          if-no-files-found: error

  compile-windows:
    name: Compile Windows standalone binary
    runs-on: windows-latest
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Write production build configuration
        shell: pwsh
        run: |
          @"
          TQX_BUILD_BASE_URL=$env:TQX_BUILD_BASE_URL
          TQX_BUILD_TRADING_BASE_URL=$env:TQX_BUILD_TRADING_BASE_URL
          TQX_BUILD_GET_API_KEY_URL=$env:TQX_BUILD_GET_API_KEY_URL
          "@ | Set-Content -Path .env -Encoding utf8
          Copy-Item .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and CLI
        run: bun run build

      - name: Compile Windows standalone binary
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-bin | Out-Null
          bun build --compile --target=bun-windows-x64 --windows-icon=packages/cli/assets/tqx.ico --outfile="dist-bin/tqx-v${version}-windows-x64.exe" packages/cli/dist/index.mjs

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-windows
          path: dist-bin/*.exe
          if-no-files-found: error

  package-binaries:
    name: Compress binaries and generate checksums
    needs:
      - publish
      - compile-macos
      - compile-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Flatten downloaded release artifacts
        shell: bash
        run: |
          find release-assets -mindepth 2 -type f \( -name 'tqx-v*' -o -name '*.tgz' \) -exec cp {} release-assets/ \;
          find release-assets -mindepth 2 -type f -name '*.exe' -exec cp {} release-assets/ \;
          find release-assets -mindepth 2 -type f -delete
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Compress standalone binaries
        shell: bash
        run: |
          cd release-assets
          # Raw binaries stay published so older CLIs can still self-update.
          gzip -9 --keep --no-name tqx-v*
          ls -l tqx-v*

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum tqx-v* > SHA256SUMS

      - name: Upload packaged release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  verify-binaries:
    name: Verify ${{ matrix.asset }} binary
    needs: package-binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
          - runner: macos-latest
            asset: macos-arm64
          - runner: macos-15-intel
            asset: macos-x64
          - runner: windows-latest
            asset: windows-x64.exe
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Write production build configuration
        shell: bash
        run: |
          printf 'TQX_BUILD_BASE_URL=%s\nTQX_BUILD_TRADING_BASE_URL=%s\nTQX_BUILD_GET_API_KEY_URL=%s\n' \
            "$TQX_BUILD_BASE_URL" "$TQX_BUILD_TRADING_BASE_URL" "$TQX_BUILD_GET_API_KEY_URL" > .env
          cp .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the Node.js reference CLI
        run: bun run build

      - name: Download packaged release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Verify checksums and gzip asset
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          asset="tqx-v${version}-${{ matrix.asset }}"
          chmod +x "release-assets/$asset"
          bun scripts/verify-release-assets.ts release-assets "$asset"

      - name: Compare the binary with Node.js end to end
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          bun scripts/standalone-e2e.ts "release-assets/tqx-v${version}-${{ matrix.asset }}"

  release:
    name: Create GitHub Release
    needs: verify-binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # gh release create resolves the target repository from the git checkout.
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Download packaged release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="$GITHUB_REF_NAME"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md"

          cat > release-notes.md <<'EOF'
          TQX CLI binaries and npm packages for version **__VERSION__**.

          ### Standalone CLI binaries

          Choose the asset matching your operating system and CPU architecture:

          - **Windows x64**: `tqx-v__VERSION__-windows-x64.exe`
          - **macOS Apple Silicon**: `tqx-v__VERSION__-macos-arm64`
          - **macOS Intel**: `tqx-v__VERSION__-macos-x64`
          - **Linux x64**: `tqx-v__VERSION__-linux-x64`
          - **Linux ARM64**: `tqx-v__VERSION__-linux-arm64`

          Each binary also has a gzip-compressed `.gz` asset that is less than half the download size.
          Decompress it, for example with `gunzip`, to get the same binary.

          Standalone binaries include the CLI runtime and do not require Node.js. For installation,
          upgrades, authentication, and architecture details, see the [TQX CLI skill installation guide](https://github.com/tqx-ai/tqx-ts/blob/__TAG__/skills/tqx-trading/references/commands.md). Installed CLIs can check and upgrade themselves with `tqx self-update`.

          `SHA256SUMS` is included below as a release asset for integrity verification.

          ### Changelog

          See the [full CHANGELOG.md](__CHANGELOG_URL__) for this release and previous releases.

          EOF

          sed -i \
            -e "s|__TAG__|$tag|g" \
            -e "s|__VERSION__|$version|g" \
            -e "s|__CHANGELOG_URL__|$changelog_url|g" \
            release-notes.md

          if grep -Eq '__TAG__|__VERSION__|__CHANGELOG_URL__|\$\{(tag|version|changelog_url)\}' release-notes.md; then
            echo 'Release notes still contain unresolved placeholders' >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=("$GITHUB_REF_NAME" release-assets/* --title "TQX $GITHUB_REF_NAME" --notes-file release-notes.md)
          [[ "$GITHUB_REF_NAME" == *-* ]] && args+=(--prerelease)
          gh release create "${args[@]}"
