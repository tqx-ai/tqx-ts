name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs are dry runs: they build, compress, and verify every binary on its own platform,
  # upload everything to a temporary draft GitHub Release and delete it, and never publish to npm or
  # publish a release. The packaged files stay available as the release-assets workflow artifact.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build packages and Linux binaries
    runs-on: ubuntu-latest
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Confirm tag and package version agree
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Write production build configuration
        shell: bash
        run: |
          cat > .env <<EOF
          TQX_BUILD_BASE_URL=$TQX_BUILD_BASE_URL
          TQX_BUILD_TRADING_BASE_URL=$TQX_BUILD_TRADING_BASE_URL
          TQX_BUILD_GET_API_KEY_URL=$TQX_BUILD_GET_API_KEY_URL
          EOF
          cp .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release checks
        run: bun run release:check

      - name: Build SDK and CLI
        run: bun run build

      - name: Pack npm tarballs with Bun
        shell: bash
        run: |
          mkdir -p release-artifacts
          bun pm pack --cwd packages/sdk --destination "$GITHUB_WORKSPACE/release-artifacts" --quiet
          bun pm pack --cwd packages/cli --destination "$GITHUB_WORKSPACE/release-artifacts" --quiet

      - name: Compile Linux standalone binaries
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-bin
          bun build --compile --target=bun-linux-x64 --outfile="dist-bin/tqx-v${version}-linux-x64" packages/cli/dist/index.mjs
          bun build --compile --target=bun-linux-arm64 --outfile="dist-bin/tqx-v${version}-linux-arm64" packages/cli/dist/index.mjs

      - name: Upload package and Linux release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-unix
          path: |
            release-artifacts/*.tgz
            dist-bin/*
          if-no-files-found: error

  compile-macos:
    name: Compile and sign macOS standalone binaries
    runs-on: macos-latest
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Write production build configuration
        shell: bash
        run: |
          printf 'TQX_BUILD_BASE_URL=%s\nTQX_BUILD_TRADING_BASE_URL=%s\nTQX_BUILD_GET_API_KEY_URL=%s\n' \
            "$TQX_BUILD_BASE_URL" "$TQX_BUILD_TRADING_BASE_URL" "$TQX_BUILD_GET_API_KEY_URL" > .env
          cp .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and CLI
        run: bun run build

      - name: Compile and ad-hoc sign macOS standalone binaries
        shell: bash
        run: |
          version="$(bun -p "require('./package.json').version")"
          mkdir -p dist-bin
          for arch in x64 arm64; do
            binary="dist-bin/tqx-v${version}-macos-${arch}"
            bun build --compile --target="bun-darwin-${arch}" --outfile="$binary" packages/cli/dist/index.mjs
            # Appending the CLI invalidates the Bun runtime's embedded signature. The darwin-x64
            # runtime keeps Bun's Developer ID signature, and macOS then rejects keychain reads
            # (errSecAuthFailed), so Bun.secrets can store an API key but never read it back.
            codesign --force --sign - "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-macos
          path: dist-bin/*
          if-no-files-found: error

  compile-windows:
    name: Compile Windows standalone binary
    runs-on: windows-latest
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Write production build configuration
        shell: pwsh
        run: |
          @"
          TQX_BUILD_BASE_URL=$env:TQX_BUILD_BASE_URL
          TQX_BUILD_TRADING_BASE_URL=$env:TQX_BUILD_TRADING_BASE_URL
          TQX_BUILD_GET_API_KEY_URL=$env:TQX_BUILD_GET_API_KEY_URL
          "@ | Set-Content -Path .env -Encoding utf8
          Copy-Item .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK and CLI
        run: bun run build

      - name: Compile Windows standalone binary
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-bin | Out-Null
          bun build --compile --target=bun-windows-x64 --windows-icon=packages/cli/assets/tqx.ico --outfile="dist-bin/tqx-v${version}-windows-x64.exe" packages/cli/dist/index.mjs

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets-windows
          path: dist-bin/*.exe
          if-no-files-found: error

  package-binaries:
    name: Compress binaries and generate checksums
    needs:
      - build
      - compile-macos
      - compile-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Flatten downloaded release artifacts
        shell: bash
        run: |
          find release-assets -mindepth 2 -type f \( -name 'tqx-v*' -o -name '*.tgz' \) -exec cp {} release-assets/ \;
          find release-assets -mindepth 2 -type f -name '*.exe' -exec cp {} release-assets/ \;
          find release-assets -mindepth 2 -type f -delete
          find release-assets -mindepth 1 -type d -empty -delete

      - name: Compress standalone binaries
        shell: bash
        run: |
          cd release-assets
          # Raw binaries stay published so older CLIs can still self-update.
          gzip -9 --keep --no-name tqx-v*
          ls -l tqx-v*

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum tqx-v* > SHA256SUMS

      - name: Upload packaged release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  verify-binaries:
    name: Verify ${{ matrix.asset }} binary
    needs: package-binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
          - runner: macos-latest
            asset: macos-arm64
          - runner: macos-15-intel
            asset: macos-x64
          - runner: windows-latest
            asset: windows-x64.exe
    env:
      TQX_BUILD_BASE_URL: ${{ vars.TQX_BUILD_BASE_URL }}
      TQX_BUILD_TRADING_BASE_URL: ${{ vars.TQX_BUILD_TRADING_BASE_URL }}
      TQX_BUILD_GET_API_KEY_URL: ${{ vars.TQX_BUILD_GET_API_KEY_URL }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Write production build configuration
        shell: bash
        run: |
          printf 'TQX_BUILD_BASE_URL=%s\nTQX_BUILD_TRADING_BASE_URL=%s\nTQX_BUILD_GET_API_KEY_URL=%s\n' \
            "$TQX_BUILD_BASE_URL" "$TQX_BUILD_TRADING_BASE_URL" "$TQX_BUILD_GET_API_KEY_URL" > .env
          cp .env .env.prod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the Node.js reference CLI
        run: bun run build

      - name: Download packaged release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Verify checksums and gzip asset
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          asset="tqx-v${version}-${{ matrix.asset }}"
          chmod +x "release-assets/$asset"
          bun scripts/verify-release-assets.ts release-assets "$asset"

      - name: Compare the binary with Node.js end to end
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          bun scripts/standalone-e2e.ts "release-assets/tqx-v${version}-${{ matrix.asset }}"

  # Publishing starts only after every binary passed verification. Order matters:
  # 1. Upload everything to a draft release first, where upload problems surface invisibly.
  # 2. Publish npm next; npm-installed CLIs update from npm once they see the GitHub Release.
  # 3. Publish the draft last, because the GitHub Release is what announces the update to users.
  # Every step can be rerun: published npm versions are skipped and a leftover draft is replaced.
  publish:
    name: Publish npm packages and the GitHub Release
    needs: verify-binaries
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name != 'push' }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Download packaged release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Resolve release metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$DRY_RUN" == true ]]; then
            # Draft releases do not create tags, so the temporary tag name never reaches the repository.
            tag="dry-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            notes_ref="$GITHUB_SHA"
          else
            tag="$GITHUB_REF_NAME"
            notes_ref="$GITHUB_REF_NAME"
          fi
          npm_tag=latest
          prerelease=false
          if [[ "$version" == *-* ]]; then
            npm_tag=beta
            prerelease=true
          fi
          {
            echo "VERSION=$version"
            echo "RELEASE_TAG=$tag"
            echo "NOTES_REF=$notes_ref"
            echo "NPM_TAG=$npm_tag"
            echo "PRERELEASE=$prerelease"
          } >> "$GITHUB_ENV"

      - name: Prepare release notes
        shell: bash
        run: |
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/blob/${NOTES_REF}/CHANGELOG.md"

          cat > release-notes.md <<'EOF'
          TQX CLI binaries and npm packages for version **__VERSION__**.

          ### Standalone CLI binaries

          Choose the asset matching your operating system and CPU architecture:

          - **Windows x64**: `tqx-v__VERSION__-windows-x64.exe`
          - **macOS Apple Silicon**: `tqx-v__VERSION__-macos-arm64`
          - **macOS Intel**: `tqx-v__VERSION__-macos-x64`
          - **Linux x64**: `tqx-v__VERSION__-linux-x64`
          - **Linux ARM64**: `tqx-v__VERSION__-linux-arm64`

          Each binary also has a gzip-compressed `.gz` asset that is less than half the download size.
          Decompress it, for example with `gunzip`, to get the same binary.

          Standalone binaries include the CLI runtime and do not require Node.js. For installation,
          upgrades, authentication, and architecture details, see the [TQX CLI skill installation guide](https://github.com/tqx-ai/tqx-ts/blob/__TAG__/skills/tqx-trading/references/commands.md). Installed CLIs can check and upgrade themselves with `tqx self-update`.

          `SHA256SUMS` is included below as a release asset for integrity verification.

          ### Changelog

          See the [full CHANGELOG.md](__CHANGELOG_URL__) for this release and previous releases.

          EOF

          sed -i \
            -e "s|__TAG__|$NOTES_REF|g" \
            -e "s|__VERSION__|$VERSION|g" \
            -e "s|__CHANGELOG_URL__|$changelog_url|g" \
            release-notes.md

          if grep -Eq '__TAG__|__VERSION__|__CHANGELOG_URL__|\$\{(tag|version|changelog_url)\}' release-notes.md; then
            echo 'Release notes still contain unresolved placeholders' >&2
            exit 1
          fi

      # Every gh command passes --repo, so none depends on the checkout to find the repository.
      - name: Upload all assets to a draft GitHub Release
        shell: bash
        run: |
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$existing" == true ]]; then
            echo "Replacing the unpublished draft left by an earlier attempt"
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          args=("$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --draft
            --target "$GITHUB_SHA" --title "TQX v$VERSION" --notes-file release-notes.md)
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
          gh release create "${args[@]}"

      - name: Confirm the draft contains every asset
        shell: bash
        run: |
          expected="$(find release-assets -maxdepth 1 -type f | wc -l)"
          actual="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          echo "Draft ${RELEASE_TAG} has ${actual}/${expected} assets"
          test "$actual" -eq "$expected"

      - name: Delete the dry-run draft
        if: always() && env.DRY_RUN == 'true'
        shell: bash
        run: gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Publish SDK to npm
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          if npm view "@tqx-ai/sdk@${VERSION}" version > /dev/null 2>&1; then
            echo "@tqx-ai/sdk@${VERSION} is already published"
          else
            npm publish "release-assets/tqx-ai-sdk-${VERSION}.tgz" --access public --tag "$NPM_TAG" --provenance
          fi

      - name: Publish CLI to npm
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          if npm view "@tqx-ai/cli@${VERSION}" version > /dev/null 2>&1; then
            echo "@tqx-ai/cli@${VERSION} is already published"
          else
            npm publish "release-assets/tqx-ai-cli-${VERSION}.tgz" --access public --tag "$NPM_TAG" --provenance
          fi

      - name: Publish the GitHub Release
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          args=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false)
          [[ "$PRERELEASE" != true ]] && args+=(--latest)
          gh release edit "${args[@]}"
